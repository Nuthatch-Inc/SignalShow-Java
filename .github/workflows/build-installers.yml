name: Build Native Installers

on:
  push:
    tags:
      - "v*" # Trigger on version tags like v1.0.0
  workflow_dispatch: # Allow manual trigger

jobs:
  build-mac:
    name: Build macOS Installer
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      - name: Install JAI to local Maven repo
        run: |
          mvn install:install-file -Dfile=legacy-build/jai_core.jar \
            -DgroupId=javax.media.jai -DartifactId=jai-core \
            -Dversion=1.1.3 -Dpackaging=jar
          mvn install:install-file -Dfile=legacy-build/jai_codec.jar \
            -DgroupId=javax.media.jai -DartifactId=jai-codec \
            -Dversion=1.1.3 -Dpackaging=jar

      - name: Create macOS icon
        run: |
          chmod +x create-mac-icon.sh
          ./create-mac-icon.sh

      - name: Build macOS DMG
        run: |
          chmod +x build-installer-mac.sh
          ./build-installer-mac.sh

      - name: Verify the finished macOS installer payload
        run: |
          mount="$RUNNER_TEMP/signalshow-installer"
          mkdir -p "$mount"
          hdiutil attach target/dist/*.dmg -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          python3 scripts/verify_installer_payload.py "$mount/SignalShow.app/Contents/app" --jar target/installer-input/*.jar
          uname -m

      - name: Upload portable Java executable
        uses: actions/upload-artifact@v4
        with:
          name: SignalShow-Java
          path: target/installer-input/*.jar
          if-no-files-found: error
          retention-days: 90

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: SignalShow-macOS
          path: target/dist/*.dmg
          if-no-files-found: error
          retention-days: 90

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset -y
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $GITHUB_PATH

      - name: Install ImageMagick (for icon conversion)
        run: choco install imagemagick -y

      - name: Install JAI to local Maven repo
        shell: bash
        run: |
          mvn install:install-file -Dfile=legacy-build/jai_core.jar \
            -DgroupId=javax.media.jai -DartifactId=jai-core \
            -Dversion=1.1.3 -Dpackaging=jar
          mvn install:install-file -Dfile=legacy-build/jai_codec.jar \
            -DgroupId=javax.media.jai -DartifactId=jai-codec \
            -Dversion=1.1.3 -Dpackaging=jar

      - name: Create Windows icon
        shell: bash
        run: |
          chmod +x create-windows-icon.sh
          ./create-windows-icon.sh

      - name: Build Windows Installer
        shell: bash
        run: |
          chmod +x build-installer-windows.sh
          ./build-installer-windows.sh

      - name: Verify the finished Windows installer payload
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem target/dist -Filter *.msi)
          if ($msi.Count -ne 1) { throw "Expected one MSI installer" }
          $extract = Join-Path $env:RUNNER_TEMP 'signalshow-installer'
          $log = Join-Path $env:RUNNER_TEMP 'signalshow-extract.log'
          $arguments = @('/a', "`"$($msi[0].FullName)`"", '/qn', "TARGETDIR=`"$extract`"", '/L*v', "`"$log`"")
          $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content $log; throw "MSI extraction failed: $($process.ExitCode)" }
          $config = @(Get-ChildItem $extract -Recurse -Filter SignalShow.cfg)
          if ($config.Count -ne 1) { throw "Expected one installed application" }
          $jar = @(Get-ChildItem target/installer-input -Filter *.jar)
          if ($jar.Count -ne 1) { throw "Expected one built executable" }
          python scripts/verify_installer_payload.py $config[0].DirectoryName --jar $jar[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Installer payload check failed" }

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: SignalShow-Windows
          path: target/dist/*.msi
          if-no-files-found: error
          retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: SignalShow-macOS
          path: dist/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SignalShow-Windows
          path: dist/

      - name: Download portable Java artifact
        uses: actions/download-artifact@v4
        with:
          name: SignalShow-Java
          path: dist/

      - name: Write download checksums
        working-directory: dist
        run: sha256sum *.dmg *.msi *.jar > SHA256SUMS.txt

      - name: Select versioned release notes
        run: cp "docs/releases/${GITHUB_REF_NAME#v}.md" RELEASE-NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.msi
            dist/*.jar
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: false
          body_path: RELEASE-NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
